databases:
  - name: krishi-rakshak-db
    databaseName: krishirakshak
    user: krishi
    plan: free

services:
  - type: web
    name: krishi-rakshak-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  - type: web
    name: krishi-rakshak-web
    runtime: node
    region: singapore
    plan: free
    rootDir: web
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: BACKEND_URL
        fromService:
          type: web
          name: krishi-rakshak-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: krishi-rakshak-db
          property: connectionString
      - key: ANALYZE_TIMEOUT_SECONDS
        value: "240"
      - key: HEALTH_TIMEOUT_SECONDS
        value: "60"
      - key: HEALTH_RETRIES
        value: "3"
      - key: AUTH_MODE
        value: google
      - key: NEXT_PUBLIC_AUTH_MODE
        value: google
      # Set these in the Render dashboard (Secrets) before first deploy:
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
